<div class="p-6 space-y-6">
  <div class="flex items-center justify-between">
    <h1 class="text-2xl font-semibold">Training Videos</h1>
    <div class="flex gap-4">
      <input
        type="text"
        placeholder="Search videos..."
        class="px-4 py-2 border rounded-md shadow-sm focus:outline-none focus:ring focus:border-blue-300"
        [value]="search()"
        (input)="search.set($any($event.target).value)"
      />
      <button
        class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700"
        (click)="showUploadModal.set(true)"
      >
        Upload Video
      </button>
    </div>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
    @for (video of filteredVideos(); track video.id) {
      <div class="bg-white rounded-xl shadow p-4 flex flex-col justify-between">
        <div>
          <h2 class="text-lg font-semibold mb-1">{{ video.title }}</h2>
          <p class="text-sm text-gray-600">{{ video.description }}</p>
        </div>
        <div class="mt-4 flex gap-2">
          <button
            class="flex-1 bg-green-600 text-white px-3 py-1 rounded hover:bg-green-700"
            (click)="playVideo(video.id)"
          >
            Play
          </button>
          <button
            class="flex-1 bg-gray-600 text-white px-3 py-1 rounded hover:bg-gray-700"
            (click)="downloadVideo(video.id)"
          >
            Download
          </button>
        </div>
      </div>
    }
    @empty {
      <p class="text-gray-500 col-span-full text-center">No videos found.</p>
    }
  </div>

  @if (showUploadModal()) {
    <div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
      <div class="bg-white w-full max-w-md rounded-xl shadow-lg p-6 space-y-4">
        <h2 class="text-xl font-bold mb-2">Upload Video</h2>
        <form (submit)="submitForm(); $event.preventDefault()" class="space-y-4">
          <input
            type="text"
            [(ngModel)]="title"
            name="title"
            placeholder="Title"
            class="w-full px-4 py-2 border rounded focus:outline-none"
            required
          />
          <textarea
            [(ngModel)]="description"
            name="description"
            placeholder="Description"
            rows="3"
            class="w-full px-4 py-2 border rounded focus:outline-none"
            required
          ></textarea>
          <input
            type="file"
            (change)="onFileChange($event)"
            accept="video/*"
            class="block w-full text-sm text-gray-500"
            required
          />
          <div class="flex justify-end gap-3">
            <button
              type="button"
              class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400"
              (click)="showUploadModal.set(false)"
            >
              Cancel
            </button>
            <button
            type="submit"
            class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 disabled:opacity-50"
            [disabled]="uploading()"
            >
            {{ uploading() ? 'Uploading...' : 'Upload' }}
            </button>

          </div>
        </form>
      </div>
    </div>
  }

  @if (showPlayerModal()) {
    <div class="fixed inset-0 bg-black/70 flex items-center justify-center z-50">
      <div class="bg-white max-w-2xl w-full rounded-xl shadow-lg p-4 relative">
        <button
          class="absolute top-1 right-1 text-gray-600 hover:text-black"
          (click)="showPlayerModal.set(false)"
        >
          ✕
        </button>
        @if (selectedVideo(); as video) {
          <video
            [src]="'http://localhost:5110/api/videos/' + video.id + '/stream'"
            controls
            autoplay
            class="w-full rounded-md"
          ></video>
          <h3 class="text-lg font-semibold mt-2">{{ video.title }}</h3>
          <p class="text-sm text-gray-600">{{ video.description }}</p>
        }
      </div>
    </div>
  }
</div>
