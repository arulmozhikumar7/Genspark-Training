<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Frontend Calling Backend</title>
</head>
<body>
  <h1>Frontend Page</h1>
  <p id="response">Waiting for backend response...</p>

  <script>
    fetch("/api/")
      .then(res => res.json())
      .then(data => {
        document.getElementById('response').textContent = data.message;
      })
      .catch(err => {
        document.getElementById('response').textContent = 'Error: ' + err;
      });
  </script>
</body>
</html>
